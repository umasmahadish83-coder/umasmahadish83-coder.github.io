<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رحلة أبطال التوحيد — دروس تفاعلية</title>
  <style>
    :root{--green:#3bb36e;--blue:#3a92d6;--gold:#f7c95d;--bg:#f6fffb;--card:#fff;--text:#123;--muted:#476;}
    *{box-sizing:border-box}
    body{margin:0;font-family:Segoe UI, Tahoma, sans-serif;background:linear-gradient(180deg,#f7fff8,#eef7ff);color:var(--text);direction:rtl}
    header{background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
    .brand{font-weight:900;font-size:1.1rem;display:flex;align-items:center;gap:12px}
    .container{width:min(1100px,94%);margin:20px auto}

    /* Fixed lesson button (top-right) */
    .fixed-lesson{
      position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;align-items:flex-end
    }
    .lesson-btn{background:linear-gradient(135deg,var(--gold),#ffd36a);border:none;padding:12px 16px;border-radius:12px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.15)}
    .balance-badge{background:#fff;padding:8px 12px;border-radius:999px;font-weight:900;color:var(--green);box-shadow:0 8px 20px rgba(30,80,50,.08)}

    /* Main area: show list of available lessons (compact cards) */
    .lessons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:18px}
    .card{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 10px 30px rgba(15,60,50,.06);border:1px solid rgba(20,80,70,.04)}
    .card h3{margin:6px 0 8px}
    .card p{color:var(--muted);margin:0}
    .start-small{background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;border:none;padding:8px 12px;border-radius:10px;font-weight:800;cursor:pointer}

    /* Quiz modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:2000}
    .overlay.show{display:grid}
    .quiz-card{background:#fff;max-width:760px;width:96%;border-radius:14px;padding:18px}
    .quiz-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .q-text{font-size:1.25rem;margin:12px 0}
    .answers{display:grid;gap:10px}
    .opt{background:#f6fbff;border:1px solid rgba(40,120,160,.08);padding:12px;border-radius:10px;cursor:pointer;font-weight:800}
    .opt.correct{background:#e8fbef;border-color:#4fc17f;color:#065a35}
    .opt.wrong{background:#fff0f0;border-color:#ee7d6b;color:#9b2f2f}
    .controls{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
    .btn{padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:900}
    .btn.primary{background:linear-gradient(135deg,var(--green),var(--blue));color:#fff}
    .btn.ghost{background:#fff;border:1px solid rgba(20,60,50,.06)}

    /* Reward modal */
    .reward-modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.45);z-index:2500}
    .reward-modal.show{display:grid}
    .reward-card{background:linear-gradient(135deg,#fffaf0,#fff8dd);padding:20px;border-radius:12px;text-align:center;max-width:420px;width:94%}
    .reward-card h2{margin:6px 0;color:var(--gold)}
    .reward-card p{font-weight:800}

    footer{padding:20px;text-align:center;color:var(--muted)}

    @media (max-width:560px){.brand{font-size:1rem}.q-text{font-size:1.05rem}}
  </style>
</head>
<body>
  <header>
    <div class="brand">رحلة أبطال التوحيد — دروس تفاعلية</div>
    <div style="opacity:.95;font-weight:800">آمن للأطفال • واجهة عربية RTL</div>
  </header>

  <!-- Fixed lesson button + balance -->
  <div class="fixed-lesson" aria-hidden="false">
    <div class="balance-badge" id="balanceTop">0 د.إ</div>
    <button class="lesson-btn" id="startLessonBtn">تعلم درس</button>
  </div>

  <main class="container">
    <h2 style="margin-top:6px">اختر درسًا أو اضغط "تعلم درس" لبدء اختبار مكوّن من 10 أسئلة</h2>

    <div class="lessons-grid" id="lessonsGrid"></div>

    <!-- Quiz overlay -->
    <div class="overlay" id="quizOverlay" role="dialog" aria-modal="true">
      <div class="quiz-card" id="quizCard">
        <div class="quiz-head">
          <div style="font-weight:900" id="quizTitle">درس تجريبي</div>
          <div style="color:var(--muted)" id="quizProgress">1 / 10</div>
        </div>
        <div class="q-text" id="questionText">السؤال هنا</div>
        <div class="answers" id="answersList"></div>
        <div class="controls">
          <div style="color:var(--muted);font-weight:800" id="quizScore">الدرجات: 0</div>
          <div>
            <button class="btn ghost" id="quitQuiz">إنهاء</button>
            <button class="btn primary" id="nextBtn">التالي</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Reward modal -->
    <div class="reward-modal" id="rewardModal">
      <div class="reward-card">
        <h2 id="rewardTitle">مبروك!</h2>
        <p id="rewardText">لقد ربحت 100 د.إ</p>
        <div style="margin-top:12px">
          <button class="btn primary" id="closeReward">حسناً</button>
        </div>
      </div>
    </div>

  </main>

  <footer>هذا الموقع تعليمي منزلي — المكافآت نقدًا تُدار بين الأهل والأبناء خارج التطبيق.</footer>

  <script>
    // بيانات بسيطة: 6 دروس، كل درس يستعمل 10 أسئلة (بناء تلقائي من أسئلة قصيرة)
    const lessonBank = [
      {id:1,title:'معنى التوحيد'},
      {id:2,title:'لماذا نعبد الله وحده؟'},
      {id:3,title:'معنى العبادة'},
      {id:4,title:'الدعاء والاستعانة بالله'},
      {id:5,title:'أهمية الإخلاص'},
      {id:6,title:'أمثلة من حياتنا اليومية'}
    ];

    const storageKey = 'ua-tawheed-v2';
    const state = { balance:0, awardedLessons:[], completed:[] };

    function save(){ localStorage.setItem(storageKey, JSON.stringify(state)); }
    function load(){ try{ const s=localStorage.getItem(storageKey); if(s){ Object.assign(state, JSON.parse(s)); } }catch(e){console.warn(e);} }

    // build lessons grid
    function renderLessons(){
      const grid = document.getElementById('lessonsGrid');
      grid.innerHTML = lessonBank.map(l=>{
        const done = state.awardedLessons.includes(l.id);
        return `<div class="card">
          <h3>${l.title}</h3>
          <p>اختبار تفاعلي مكوّن من 10 أسئلة قصيرة.</p>
          <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-start">
            <button class="start-small" data-id="${l.id}">${done? 'أنهيت' : 'ابدأ الدرس'}</button>
            ${done? '<div style="padding:8px;border-radius:8px;background:linear-gradient(90deg,#fff,#f6ffef);font-weight:800;color:#2a6;">+100 د.إ</div>':''}
          </div>
        </div>`;
      }).join('');

      // attach handlers
      document.querySelectorAll('.start-small').forEach(btn=>btn.addEventListener('click',()=>{
        const id = Number(btn.dataset.id);
        startLessonById(id);
      }));
    }

    // Simple question generator: pick from a pool of templates
    const qPool = [
      {q:'ما معنى التوحيد؟',opts:['أن نعبد الله وحده','أن نعبد الناس','أن ننسى الله','أن نطلب من الصور'],correct:0},
      {q:'لماذا نعبد الله؟',opts:['لأنه خالقنا','لأن الناس يفعلون','للمكسب فقط','لا سبب'],correct:0},
      {q:'ما هي العبادة؟',opts:['كل ما يحبّه الله','الجلوس فقط','اللعب والمزاح','السرقة'],correct:0},
      {q:'ماذا نفعل عند الحاجة؟',opts:['ندعو الله ونستعين به','نزور أحداً آخر','لا نفعل شيئاً','نبتعد'],correct:0},
      {q:'ما معنى الإخلاص؟',opts:['العمل لله لا للناس','العمل للمدح','العمل للمال فقط','التظاهر'],correct:0},
      {q:'ماذا نفعل قبل الطعام؟',opts:['نذكر الله ونشكره','ننتظر فقط','نترك الطبق','نركض'],correct:0},
      {q:'من يستحق العبادة؟',opts:['الله وحده','النجوم','اللعبة','الصورة'],correct:0},
      {q:'من يمنحنا الرزق؟',opts:['الله سبحانه','المال فقط','الصدفة','الحظ'],correct:0},
      {q:'هل الدعاء مفيد؟',opts:['نعم، وهو عبادة','لا، ليس له فائدة','فقط للعب','غير معروف'],correct:0},
      {q:'متى نكون مخلصين؟',opts:['عندما نعمل لوجه الله','عندما نريد المدح','عند الخداع','عند الكذب'],correct:0}
    ];

    // Create a 10-question quiz for a lesson (randomized non-repeating)
    function buildQuizQuestions(){
      const copy = [...qPool];
      const questions = [];
      for(let i=0;i<10;i++){
        if(copy.length===0) copy.push(...qPool);
        const idx = Math.floor(Math.random()*copy.length);
        const item = copy.splice(idx,1)[0];
        // shuffle options
        const opts = item.opts.map((o,i)=>({o,i}));
        for(let j= opts.length-1;j>0;j--){ const k=Math.floor(Math.random()*(j+1)); [opts[j],opts[k]]=[opts[k],opts[j]] }
        // find new correct index
        const correctOpt = opts.findIndex(x=>x.i===item.correct);
        questions.push({q:item.q,opts:opts.map(x=>x.o),correct:correctOpt});
      }
      return questions;
    }

    // Quiz runtime state
    let quiz = null; // {lessonId,questions,idx,score}

    function openQuizUI(){ document.getElementById('quizOverlay').classList.add('show'); renderQuiz(); }
    function closeQuizUI(){ document.getElementById('quizOverlay').classList.remove('show'); quiz=null; }

    function startLessonById(lessonId){
      // if already awarded, still allow retake but no extra money
      const lesson = lessonBank.find(x=>x.id===lessonId);
      if(!lesson) return alert('درس غير موجود');
      quiz = {lessonId,questions:buildQuizQuestions(),idx:0,score:0,answered:false};
      document.getElementById('quizTitle').textContent = lesson.title;
      openQuizUI();
    }

    function renderQuiz(){
      if(!quiz) return;
      const q = quiz.questions[quiz.idx];
      document.getElementById('quizProgress').textContent = `${quiz.idx+1} / ${quiz.questions.length}`;
      document.getElementById('questionText').textContent = q.q;
      const answersList = document.getElementById('answersList'); answersList.innerHTML='';
      q.opts.forEach((opt,i)=>{
        const btn = document.createElement('div'); btn.className='opt'; btn.tabIndex=0; btn.textContent = opt;
        btn.addEventListener('click',()=>selectOption(i,btn));
        answersList.appendChild(btn);
      });
      document.getElementById('quizScore').textContent = `الدرجات: ${quiz.score}`;
      // next button
      document.getElementById('nextBtn').textContent = quiz.idx+1===quiz.questions.length ? 'إنهاء' : 'التالي';
    }

    function selectOption(index,btnElement){
      if(!quiz || quiz.answered) return; quiz.answered=true;
      const q = quiz.questions[quiz.idx];
      const nodes = Array.from(document.querySelectorAll('.opt'));
      // mark correct/wrong
      nodes.forEach((n,ii)=>{ n.classList.remove('correct','wrong'); n.style.pointerEvents='none'; });
      if(index===q.correct){ btnElement.classList.add('correct'); quiz.score+=10; }
      else{ btnElement.classList.add('wrong'); nodes[q.correct].classList.add('correct'); }
      document.getElementById('quizScore').textContent = `الدرجات: ${quiz.score}`;
    }

    document.getElementById('nextBtn').addEventListener('click',()=>{
      if(!quiz) return;
      // if not answered, treat as wrong and move on
      quiz.answered=false;
      if(quiz.idx+1 < quiz.questions.length){ quiz.idx++; renderQuiz(); }
      else{ finishQuiz(); }
    });

    document.getElementById('quitQuiz').addEventListener('click',()=>{
      if(confirm('هل تريد الخروج من الاختبار؟ التقدم غير محفوظ.')) closeQuizUI();
    });

    function finishQuiz(){
      const lessonId = quiz.lessonId;
      const earned = 100;
      // award only once per lesson
      const firstTime = !state.awardedLessons.includes(lessonId);
      if(firstTime){ state.balance += earned; state.awardedLessons.push(lessonId); }
      // save completed array
      if(!state.completed.includes(lessonId)) state.completed.push(lessonId);
      save(); updateUI();
      // show reward modal
      document.getElementById('rewardTitle').textContent = 'مبروك يا بطل!';
      document.getElementById('rewardText').textContent = firstTime ? `لقد ربحت ${earned} د.إ` : 'لقد أنهيت الدرس سابقًا — لا يوجد رصيد إضافي';
      document.getElementById('rewardModal').classList.add('show');
      closeQuizUI();
    }

    document.getElementById('closeReward').addEventListener('click',()=>{
      document.getElementById('rewardModal').classList.remove('show'); renderLessons();
    });

    // Start Lesson button top-right uses next uncompleted lesson or asks to pick
    document.getElementById('startLessonBtn').addEventListener('click',()=>{
      // find first lesson not yet awarded
      const next = lessonBank.find(l=>!state.awardedLessons.includes(l.id));
      if(next){ startLessonById(next.id); }
      else{ if(confirm('لقد أنهيت كل الدروس. هل تريد إعادة محاولة درس سابق؟')) startLessonById(lessonBank[0].id); }
    });

    // start by loading saved state
    function updateUI(){ document.getElementById('balanceTop').textContent = `${state.balance} د.إ`; renderLessons(); }
    load(); updateUI();

    // click on lessons grid handled via renderLessons
  </script>
</body>
</html>
